<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skåne härader map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,750&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0e8; --surface:#ffffff; --ink:#1f2a24; --muted:#5d6a62; --line:#c9cfc3;
  --land:#dfe3d6; --edge:#ffffff; --sea:#d6e4ea; --focus:#1f5fbf; --err:#b3261e;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151a17; --surface:#1e2521; --ink:#e6ebe4; --muted:#9aa69e; --line:#36403a;
    --land:#2f3832; --edge:#151a17; --sea:#18232a; --focus:#7fb0ff; --err:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a17; --surface:#1e2521; --ink:#e6ebe4; --muted:#9aa69e; --line:#36403a;
  --land:#2f3832; --edge:#151a17; --sea:#18232a; --focus:#7fb0ff; --err:#ff8a80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
header{grid-column:1/-1}
h1{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:750;letter-spacing:-.02em;margin:0;line-height:1.05}
header p{margin:.4rem 0 0;color:var(--muted);max-width:60ch}
.map{background:var(--sea);border-radius:14px;overflow:hidden;position:relative}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.m{fill:var(--land);stroke:var(--edge);stroke-width:1.4;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.m:hover{filter:brightness(.93)}
.m:focus{outline:none;stroke:var(--focus);stroke-width:3}
.lbl{font-size:13px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-opacity:.75;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.lbl.s{font-size:10px}
.lbl .pct{font-weight:400}
.hide-labels .lbl{display:none}
.tip{position:absolute;left:12px;top:12px;background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:8px;font-weight:600;font-size:.95rem;box-shadow:0 1px 0 var(--line);pointer-events:none;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
aside{background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:18px}
h2{font-size:1.05rem;margin:0 0 8px;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sw.erase{background:var(--land);}
.sw.erase::after{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:2px;background:var(--muted);transform:translateX(-50%) rotate(45deg)}
.custom{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:.9rem}
.custom input{width:40px;height:32px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
button.b{font:inherit;font-weight:600;font-size:.92rem;background:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.b:hover{background:var(--bg)}
button.b:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto;border-top:1px solid var(--line)}
li button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.95rem}
li button:hover{background:var(--bg)}
li button:focus-visible{outline:2px solid var(--focus)}
.dot{width:14px;height:14px;border-radius:4px;background:var(--land);border:1px solid var(--line);flex:none}
.legend{border:0;max-height:none}
.legend li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.95rem}
.legend .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.legend .dot{width:18px;height:18px}
li button .st{margin-left:auto;color:var(--muted);font-size:.85rem}
.status{font-size:.9rem;margin-top:.5rem;color:var(--muted)}
.status[data-kind="err"]{color:var(--err);font-weight:600}
.count{color:var(--muted);font-size:.88rem;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.m,.tip{transition:none}}
</style>
</head>

    <p class="status" id="status" role="status">Loading…</p>
  </header>
  <div class="map" id="mapbox">
    <svg id="svg" role="img" aria-label="Map of the 23 härader of Skåne"></svg>
    <div class="tip" id="tip"></div>
  </div>
  <aside>
    <section>
      <h2>Progress</h2>
      <ul class="legend" id="legend"></ul>
    </section>
    <section class="row">
      <button class="b" id="toggleLabels">Hide names</button>
      <button class="b" id="clear">Reset all</button>
    </section>
    <section>
      <h2>Härader</h2>
      <p class="count" id="count"></p>
      <ul id="list"></ul>
    </section>
  </aside>
</div>

// Saves run one at a time, in order, so quick repeated taps can't arrive out of order.
let queue = Promise.resolve();
function saveOne(id, prevIndex){
  if (!SHEET_URL) { setStatus("No Google Sheet connected yet, so this change isn't saved.", "err"); return; }
  pending++; changes++; setStatus("Saving…", "");
  const pct = STATES[state[id] || 0].pct;
  queue = queue.then(() => sendSave(id, pct, prevIndex));
}
async function sendSave(id, pct, prevIndex){
  try {
    await callSheet({action:"set", id, name: names[id], pct});
    setStatus("Saved", "ok");
  } catch(e) {
    if (prevIndex) state[id] = prevIndex; else delete state[id];
    apply(id); updateCounts();
    setStatus(`Couldn't save ${names[id]}. Check your connection and try again.`, "err");
  } finally { pending--; }
}
function apply(id){
  const s = STATES[state[id] || 0];
  paths[id].style.fill = s.color || "";
  dots[id].style.background = s.color || "";
  stLabels[id].textContent = s.name;
  pctEls[id].textContent = s.name;
  paths[id].setAttribute("aria-label", `${names[id]}: ${s.name}`);
}
const legendCounts = [];
STATES.forEach(s => {
  const li = document.createElement("li"), dot = document.createElement("span"), n = document.createElement("span");
  dot.className = "dot"; if (s.color) dot.style.background = s.color;
  n.className = "n"; li.append(dot, document.createTextNode(s.name), n);
  document.getElementById("legend").append(li); legendCounts.push(n);
});
function updateCounts(){
  const c = STATES.map(() => 0);
  DATA.m.forEach(m => c[state[m.id] || 0]++);
  c.forEach((v,i) => legendCounts[i].textContent = v);
  const avg = Math.round(DATA.m.reduce((sum, m) => sum + STATES[state[m.id] || 0].pct, 0) / DATA.m.length);
  document.getElementById("count").textContent = `Overall ${avg}% complete. ${c[5]} of ${DATA.m.length} at 100%.`;
}
function step(id, dir){
  const prev = state[id] || 0;
  const next = (prev + dir + STATES.length) % STATES.length;
  if (next === 0) delete state[id]; else state[id] = next;
  apply(id); updateCounts(); saveOne(id, prev);
  if (tip.classList.contains("on")) showTip(id);
}
function showTip(id){ tip.textContent = `${names[id]}: ${STATES[state[id] || 0].name}`; tip.classList.add("on"); }

DATA.m.forEach(m => {
  names[m.id] = m.name;
  const p = document.createElementNS(NS,"path");
  p.setAttribute("d", m.d); p.setAttribute("class","m");
  p.setAttribute("tabindex","0"); p.setAttribute("role","button");
  p.addEventListener("click", e => step(m.id, e.shiftKey ? -1 : 1));
  p.addEventListener("contextmenu", e => { e.preventDefault(); step(m.id, -1); });
  p.addEventListener("keydown", e => {
    if (e.key==="Enter"||e.key===" ") { e.preventDefault(); step(m.id, e.shiftKey ? -1 : 1); }
  });
  p.addEventListener("mouseenter", () => showTip(m.id));
  p.addEventListener("mouseleave", () => tip.classList.remove("on"));
  p.addEventListener("focus", () => showTip(m.id));
  p.addEventListener("blur", () => tip.classList.remove("on"));
  gShapes.append(p); paths[m.id] = p;

  const t = document.createElementNS(NS,"text");
  t.setAttribute("x", m.cx); t.setAttribute("y", m.cy);
  t.setAttribute("class", m.a < 12000 ? "lbl s" : "lbl");
  const tn = document.createElementNS(NS,"tspan");
  tn.setAttribute("x", m.cx); tn.setAttribute("dy", "-0.55em"); tn.textContent = m.name;
  const tp = document.createElementNS(NS,"tspan");
  tp.setAttribute("x", m.cx); tp.setAttribute("dy", "1.15em"); tp.setAttribute("class", "pct");
  t.append(tn, tp); gLabels.append(t); pctEls[m.id] = tp;

  const li = document.createElement("li"), b = document.createElement("button");
  const dot = document.createElement("span"), st = document.createElement("span");
  dot.className = "dot"; st.className = "st";
  b.append(dot, document.createTextNode(m.name), st);
  b.addEventListener("click", e => step(m.id, e.shiftKey ? -1 : 1));
  b.addEventListener("contextmenu", e => { e.preventDefault(); step(m.id, -1); });
  b.addEventListener("mouseenter", () => paths[m.id].style.stroke = "var(--focus)");
  b.addEventListener("mouseleave", () => paths[m.id].style.stroke = "");
  li.append(b); document.getElementById("list").append(li);
  dots[m.id] = dot; stLabels[m.id] = st;
});
DATA.m.forEach(m => apply(m.id));
updateCounts();

document.getElementById("toggleLabels").addEventListener("click", e => {
  const off = svg.classList.toggle("hide-labels");
  e.currentTarget.textContent = off ? "Show names" : "Hide names";
});
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Set every härad back to 0%?")) return;
  if (!SHEET_URL) { setStatus("No Google Sheet connected yet.", "err"); return; }
  pending++; changes++; setStatus("Resetting…", "");
  queue = queue.then(() => callSheet({action:"reset"}))
    .then(() => { state = {}; DATA.m.forEach(m => apply(m.id)); updateCounts(); setStatus("Saved", "ok"); })
    .catch(() => setStatus("Couldn't reset. Check your connection and try again.", "err"))
    .finally(() => pending--);
});

load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
